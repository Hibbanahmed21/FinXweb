<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <!-- Collapse Button -->
    <button class="collapse-btn" id="collapseBtn">☰</button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">FRIDAY</h2>
            <button class="toggle-btn" id="toggleBtn">☰</button>
        </div>
        
        <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
        
        <div class="chat-list" id="chatList">
            <!-- Chat items will be dynamically added here -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-chat">
        <div class="messages-container" id="messagesContainer">
            <div class="empty-state" id="emptyState">
                <h2>Welcome to FRIDAY</h2>
                <p>Start a new conversation to begin your financial journey</p>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="avatar bot">F</div>
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <textarea class="message-input" id="messageInput" placeholder="Ask FRIDAY anything about your finances..." autocomplete="off" rows="1"></textarea>
                <button class="send-button" id="sendButton">➤</button>
            </div>
        </div>
    </div>

    <!-- External JS -->
    <script src="js/chat.js"></script>
</body>
</html>
